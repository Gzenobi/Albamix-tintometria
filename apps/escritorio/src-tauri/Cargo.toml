[package]
name = "albamix-tintometria"
version = "0.1.0"
description = "Albamix tintometría: dosificación y precios para distribuidores"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
