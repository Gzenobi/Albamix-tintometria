name: Pruebas y versión de Windows

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  pruebas:
    name: Pruebas (motor y datos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    name: Instalador y versión portable de Windows
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/escritorio/src-tauri
      - run: npm ci
      - name: Compilar la app de Windows
        working-directory: apps/escritorio
        run: npx tauri build
      - name: Preparar archivos para descargar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force salida | Out-Null
          Copy-Item apps/escritorio/src-tauri/target/release/bundle/nsis/*.exe salida/
          Copy-Item apps/escritorio/src-tauri/target/release/albamix-tintometria.exe "salida/Albamix-Tintometria-portable.exe"
          Get-ChildItem salida
      - uses: actions/upload-artifact@v4
        with:
          name: albamix-windows-${{ github.run_number }}
          path: salida/
          retention-days: 30
